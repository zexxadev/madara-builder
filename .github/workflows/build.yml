name: Build madaraRikudou Blossom

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [Vanilla, RSKSU-SusFS]

    steps:
      - name: Checkout Builder Repo (for Changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          path: builder

      - name: Generate Auto-Changelog
        run: |
          cd builder
          LOGS=$(git log -n 5 --pretty=format:"• %s")
          {
            echo "CHANGELOG<<EOF"
            echo "$LOGS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 zip unzip

      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: proton-clang-v1

      - name: Clone Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone Kernel Source (niigo_yoka)
        run: |
          git clone --depth=1 -b rikudouV1.5 https://github.com/zexxadev/niigo_kernel_xiaomi_blossom.git kernel

      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-blossom-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-blossom-${{ matrix.variant }}-

      - name: Inject Performance, PELT 16ms, OC, Touch Polling, Storage/RAM & Charging Tweaks
        working-directory: kernel
        run: |
          python3 - << 'PY'
          import glob
          import os
          import re
          import subprocess

          def patch_file(path, pattern, repl, desc):
              try:
                  with open(path, 'r') as f:
                      txt = f.read()
                  new_txt, n = re.subn(pattern, repl, txt)
                  if n:
                      with open(path, 'w') as f:
                          f.write(new_txt)
                      print(f"Patched {desc} in {path} ({n}x) OK")
              except FileNotFoundError:
                  pass

          # 1. Scheduler: Optimasi Interactive Tasks & PELT 16ms Half-Life
          feat_file = 'kernel/sched/features.h'
          with open(feat_file, 'r') as f:
              feat = f.read()
          feat, n1 = re.subn(r'(#define\s+SCHED_FEAT_GENTLE_FAIR_SLEEPERS\s+)1\b', r'\g<1>0', feat)
          if not n1:
              feat, n1 = re.subn(r'SCHED_FEAT\(\s*GENTLE_FAIR_SLEEPERS\s*,\s*true\s*\)', 'SCHED_FEAT(GENTLE_FAIR_SLEEPERS, false)', feat)
          feat, n2 = re.subn(r'(#define\s+SCHED_FEAT_NEXT_BUDDY\s+)0\b', r'\g<1>1', feat)
          if not n2:
              feat, n2 = re.subn(r'SCHED_FEAT\(\s*NEXT_BUDDY\s*,\s*false\s*\)', 'SCHED_FEAT(NEXT_BUDDY, true)', feat)
          with open(feat_file, 'w') as f:
              f.write(feat)
          print(f"Patched Sched Features (GENTLE={n1}, NEXT_BUDDY={n2}) OK")

          pelt_gen = 'Documentation/scheduler/sched-pelt.c'
          pelt_hdr = 'kernel/sched/sched-pelt.h'
          if os.path.exists(pelt_gen) and os.path.exists(pelt_hdr):
              with open(pelt_gen, 'r') as f:
                  ptxt = f.read()
              ptxt_new, np = re.subn(r'(#define\s+HALFLIFE\s+)32\b', r'\g<1>16', ptxt)
              if np:
                  with open('/tmp/sched-pelt16.c', 'w') as f:
                      f.write(ptxt_new)
                  subprocess.run(['gcc', '/tmp/sched-pelt16.c', '-lm', '-o', '/tmp/sched-pelt16'], check=True)
                  hdr_out = subprocess.check_output(['/tmp/sched-pelt16'], text=True)
                  if 'LOAD_AVG_PERIOD 16' in hdr_out:
                      with open(pelt_hdr, 'w') as f:
                          f.write(hdr_out)
                      print("Patched PELT 16ms Half-Life (sched-pelt.h) OK")

          # 1b. Tingkatkan buffer antrean event input (tanpa memotong delay reset/init IC touchscreen)
          patch_file('drivers/input/evdev.c', r'#define\s+EVDEV_BUF_PACKETS\s+8\b', '#define EVDEV_BUF_PACKETS 32', 'evdev touch buffer 32')
          fts_core = 'drivers/input/touchscreen/ft8006s_spi/focaltech_core.c'
          if os.path.exists(fts_core):
              with open(fts_core, 'r') as f:
                  ftxt = f.read()
              orig_f = ftxt
              ftxt, n_spi = re.subn(
                  r'(spi->mode\s*=\s*SPI_MODE_0;)',
                  r'\1\n\tif (spi->max_speed_hz < 10000000)\n\t\tspi->max_speed_hz = 10000000;',
                  ftxt,
                  count=1
              )
              if ftxt != orig_f:
                  with open(fts_core, 'w') as f:
                      f.write(ftxt)
                  print(f"Patched ft8006s_spi SPI 10MHz ({n_spi}x) OK")

          # 2. GPU Overclock PowerVR GE8320 -> 920 MHz
          for pattern in ['drivers/misc/mediatek/**/*.[ch]', 'drivers/gpu/**/*.[ch]']:
              for path in glob.glob(pattern, recursive=True):
                  if 'cpufreq' in path or 'eem' in path:
                      continue
                  with open(path, 'r', errors='ignore') as f:
                      txt = f.read()
                  if not any(k in txt for k in ('GPU_DVFS', 'gpufreq', 'mtk_gpufreq', 'rgx_mtk', 'mfg')):
                      continue
                  new_txt, n_g = re.subn(
                      r'(#define\s+(?:SEG_)?GPU_DVFS_FREQ0\s*\(?\s*)(?:650000|600000|520000)(\s*\)?)',
                      r'\g<1>920000\g<2>',
                      txt
                  )
                  if not n_g and ('gpu' in path.lower() or 'mfg' in path.lower()):
                      new_txt, n_g = re.subn(r'\b650000\b', '920000', txt)
                  if n_g:
                      with open(path, 'w') as f:
                          f.write(new_txt)
                      print(f"Patched GPU OC 920MHz in {path} ({n_g}x) OK")

          for dts in glob.glob('arch/arm64/boot/dts/**/*.dts*', recursive=True):
              with open(dts, 'r', errors='ignore') as f:
                  d_txt = f.read()
              if '650000000' in d_txt and ('gpu' in d_txt.lower() or 'mfg' in d_txt.lower()):
                  d_new, n_dts = re.subn(r'\b650000000\b', '920000000', d_txt)
                  if n_dts:
                      with open(dts, 'w') as f:
                          f.write(d_new)
                      print(f"Patched GPU DTS OPP 920MHz in {dts} OK")

          # 3. CPU Overclock Little Cluster (1.5 GHz -> 1.8 GHz) & Big Cluster (2.3 GHz)
          for cpu_f in glob.glob('drivers/misc/mediatek/base/power/cpufreq_v1/**/*.[ch]', recursive=True):
              patch_file(cpu_f, r'\b1500000\b', '1800000', 'Little CPU OC 1.8GHz')
              patch_file(cpu_f, r'\b2001000\b', '2300000', 'Big CPU OC 2.3GHz')

          # 4. Storage Read & RAM Management (MGLRU TTL, Watermark, eMMC CRC Off, Block I/O)
          patch_file('mm/vmscan.c', r'\bint\s+vm_swappiness\s*=\s*60\s*;', 'int vm_swappiness = 100;', 'vm_swappiness=130')
          patch_file('mm/vmscan.c', r'\bint\s+sysctl_vfs_cache_pressure\s*=\s*100\s*;', 'int sysctl_vfs_cache_pressure = 85;', 'vfs_cache_pressure=85')
          patch_file('mm/vmscan.c', r'static\s+unsigned\s+long\s+lru_gen_min_ttl\s+__read_mostly\s*;', 'static unsigned long lru_gen_min_ttl __read_mostly = HZ;', 'MGLRU min_ttl=1000ms')
          patch_file('mm/swap.c', r'\bint\s+page_cluster\s*=\s*3\s*;', 'int page_cluster = 0;', 'page-cluster=0')
          patch_file('mm/page-writeback.c', r'\bint\s+vm_dirty_ratio\s*=\s*20\s*;', 'int vm_dirty_ratio = 15;', 'dirty_ratio=15')
          patch_file('mm/page-writeback.c', r'\bint\s+dirty_background_ratio\s*=\s*10\s*;', 'int dirty_background_ratio = 5;', 'dirty_background_ratio=5')
          patch_file('mm/page_alloc.c', r'\bint\s+watermark_scale_factor\s*=\s*10\s*;', 'int watermark_scale_factor = 10;', 'watermark_scale_factor=10')
          patch_file('mm/page_alloc.c', r'\bint\s+watermark_boost_factor\s*=\s*15000\s*;', 'int watermark_boost_factor = 0;', 'watermark_boost_factor=0')
          patch_file('mm/page_alloc.c', r'\bint\s+user_min_free_kbytes\s*=\s*-1\s*;', 'int user_min_free_kbytes = 8192;', 'user_min_free_kbytes=8192')
          patch_file('mm/vmstat.c', r'\bint\s+sysctl_stat_interval\s*=\s*HZ\s*;', 'int sysctl_stat_interval = (10 * HZ);', 'sysctl_stat_interval=10*HZ')
          patch_file('include/linux/mm.h', r'#define\s+VM_MAX_READAHEAD\s+\d+', '#define VM_MAX_READAHEAD 128', 'VM_MAX_READAHEAD=128')
          patch_file('block/elevator.c', r'elevator_get\(\s*q\s*,\s*"mq-deadline"\s*,\s*false\s*\)', 'NULL', 'blk-mq default none')

          for mmc_f in glob.glob('drivers/mmc/core/*.c'):
              patch_file(mmc_f, r'\bbool\s+use_spi_crc\s*=\s*(?:1|true)\s*;', 'bool use_spi_crc = 0;', 'eMMC SPI CRC off')

          patch_file('kernel/power/suspend.c', r'\bbool\s+sync_on_suspend\s*=\s*true\s*;', 'bool sync_on_suspend = false;', 'sync_on_suspend=false')
          patch_file('kernel/sched/fair.c', r'\bunsigned\s+int\s+sysctl_timer_migration\s*=\s*1\s*;', 'unsigned int sysctl_timer_migration = 0;', 'timer_migration=0')
          patch_file('kernel/workqueue.c', r'\bbool\s+wq_power_efficient\s*=\s*IS_ENABLED\(CONFIG_WQ_POWER_EFFICIENT_DEFAULT\)\s*;', 'bool wq_power_efficient = true;', 'wq_power_efficient=true')

          # 4b. Geser ambang thermal throttle awal +5C (batas shutdown >=95C tetap utuh)
          for th_f in glob.glob('drivers/misc/mediatek/thermal/**/*.[ch]', recursive=True):
              with open(th_f, 'r', errors='ignore') as f:
                  ttxt = f.read()
              def bump_trip(m):
                  val = int(m.group(2))
                  if 45000 <= val <= 85000:
                      return f"{m.group(1)}{val + 5000}"
                  return m.group(0)
              nttxt, nt = re.subn(r'(\btrip_temp\s*=\s*|\bTHERMAL_TRIP_TEMP\s+)(\d{5})\b', bump_trip, ttxt)
              if nt and nttxt != ttxt:
                  with open(th_f, 'w') as f:
                      f.write(nttxt)
                  print(f"Shifted thermal trip +5C in {th_f} ({nt}x) OK")

          # 5. Deep Sleep Wakelock Blocker
          wakeup_file = 'drivers/base/power/wakeup.c'
          with open(wakeup_file, 'r') as f:
              w_code = f.read()

          blocker_fn = (
              'static bool madara_is_blocked_wakelock(const char *name)\n'
              '{\n'
              '\tif (!name)\n'
              '\t\treturn false;\n'
              '\tif (!strcmp(name, "NETLINK") ||\n'
              '\t    !strcmp(name, "wlan_rx_wake") ||\n'
              '\t    !strcmp(name, "wlan_ctrl_wake") ||\n'
              '\t    !strcmp(name, "wlan_wake") ||\n'
              '\t    !strcmp(name, "SensorService") ||\n'
              '\t    !strncmp(name, "eventpoll", 9))\n'
              '\t\treturn true;\n'
              '\treturn false;\n'
              '}\n\n'
          )

          if 'madara_is_blocked_wakelock' not in w_code:
              w_new, nw = re.subn(
                  r'(static\s+void\s+wakeup_source_activate\s*\(\s*struct\s+wakeup_source\s*\*\s*ws\s*\)\s*\{.*?\n)(\tif\s*\(\s*WARN_ONCE\s*\()',
                  blocker_fn + r'\1\tif (madara_is_blocked_wakelock(ws->name))\n\t\treturn;\n\n\2',
                  w_code,
                  count=1,
                  flags=re.S
              )
              if nw:
                  with open(wakeup_file, 'w') as f:
                      f.write(w_new)
                  print("Patched Deep Sleep Wakelock Blocker OK")

          # 5b. Fix Slow Charging (AC, Non-Std AC, Apple 2.1A, SW JEITA CC & CV 4.4V)
          for chg_f in glob.glob('drivers/power/supply/mediatek/charger/**/*.[ch]', recursive=True):
              with open(chg_f, 'r', errors='ignore') as f:
                  ctxt = f.read()
              orig_c = ctxt

              ctxt = re.sub(r'(#define\s+AC_CHARGER_INPUT_CURRENT\s+)\d+', r'\g<1>2400000', ctxt)
              ctxt = re.sub(r'(#define\s+AC_CHARGER_CURRENT\s+)\d+', r'\g<1>2050000', ctxt)
              ctxt = re.sub(r'(#define\s+NON_STD_AC_CHARGER_CURRENT\s+)\d+', r'\g<1>2000000', ctxt)
              ctxt = re.sub(r'(#define\s+CHARGING_HOST_CHARGER_CURRENT\s+)\d+', r'\g<1>2000000', ctxt)
              ctxt = re.sub(r'(#define\s+APPLE_2_1A_CHARGER_CURRENT\s+)\d+', r'\g<1>2050000', ctxt)
              ctxt = re.sub(r'(#define\s+USB_CHARGER_CURRENT\s+)\d+', r'\g<1>1000000', ctxt)

              ctxt = re.sub(r'(->ac_charger_input_current\s*=\s*)\d+;', r'\g<1>2400000;', ctxt)
              ctxt = re.sub(r'(->ac_charger_current\s*=\s*)\d+;', r'\g<1>2050000;', ctxt)
              ctxt = re.sub(r'(->non_std_ac_charger_current\s*=\s*)\d+;', r'\g<1>2000000;', ctxt)
              ctxt = re.sub(r'(->charging_host_charger_current\s*=\s*)\d+;', r'\g<1>2000000;', ctxt)
              ctxt = re.sub(r'(->apple_2_1a_charger_current\s*=\s*)\d+;', r'\g<1>2050000;', ctxt)

              ctxt = re.sub(r'(#define\s+BATTERY_CV\s+)\d+', r'\g<1>4400000', ctxt)
              ctxt = re.sub(r'(#define\s+JEITA_TEMP_T1_TO_T2_CC\s+)\d+', r'\g<1>2050000', ctxt)
              ctxt = re.sub(r'(#define\s+JEITA_TEMP_T2_TO_T3_CC\s+)\d+', r'\g<1>2050000', ctxt)
              ctxt = re.sub(r'(#define\s+JEITA_TEMP_T3_TO_T4_CC\s+)\d+', r'\g<1>1500000', ctxt)
              ctxt = re.sub(r'(#define\s+JEITA_TEMP_T1_TO_T2_CV\s+)\d+', r'\g<1>4400000', ctxt)
              ctxt = re.sub(r'(#define\s+JEITA_TEMP_T2_TO_T3_CV\s+)\d+', r'\g<1>4400000', ctxt)
              ctxt = re.sub(r'(#define\s+JEITA_TEMP_T3_TO_T4_CV\s+)\d+', r'\g<1>4200000', ctxt)

              ctxt = re.sub(r'(->battery_cv\s*=\s*)\d+;', r'\g<1>4400000;', ctxt)
              ctxt = re.sub(r'(->jeita_temp_t1_to_t2_cc\s*=\s*)\d+;', r'\g<1>2050000;', ctxt)
              ctxt = re.sub(r'(->jeita_temp_t2_to_t3_cc\s*=\s*)\d+;', r'\g<1>2050000;', ctxt)
              ctxt = re.sub(r'(->jeita_temp_t3_to_t4_cc\s*=\s*)\d+;', r'\g<1>1500000;', ctxt)
              ctxt = re.sub(r'(->jeita_temp_t1_to_t2_cv\s*=\s*)\d+;', r'\g<1>4400000;', ctxt)
              ctxt = re.sub(r'(->jeita_temp_t2_to_t3_cv\s*=\s*)\d+;', r'\g<1>4400000;', ctxt)
              ctxt = re.sub(r'(->jeita_temp_t3_to_t4_cv\s*=\s*)\d+;', r'\g<1>4200000;', ctxt)

              if ctxt != orig_c:
                  with open(chg_f, 'w') as f:
                      f.write(ctxt)
                  print(f"Patched MTK charger & JEITA CC/CV in {chg_f} OK")

          for dts_f in glob.glob('arch/arm64/boot/dts/mediatek/*.dts*', recursive=True):
              with open(dts_f, 'r', errors='ignore') as f:
                  stxt = f.read()
              if 'spi@11013000' in stxt and 'mediatek,kthread-rt' not in stxt:
                  stxt_new, n_rt = re.subn(r'(spi@11013000\s*\{)', r'\1\n\tmediatek,kthread-rt;', stxt, count=1)
                  if n_rt:
                      with open(dts_f, 'w') as f:
                          f.write(stxt_new)
                      print(f"Patched mediatek,kthread-rt on spi@11013000 in {dts_f} OK")

          for dts_f in glob.glob('arch/arm64/boot/dts/mediatek/*.dts*', recursive=True):
              with open(dts_f, 'r', errors='ignore') as f:
                  dtxt = f.read()
              orig_d = dtxt
              def raise_dts(pattern, floor_val, text):
                  return re.sub(pattern, lambda m: f"{m.group(1)}{max(int(m.group(2)), floor_val)}{m.group(3)}", text)
              dtxt = raise_dts(r'(\bac_charger_input_current\s*=\s*<)(\d+)(>;)', 2400000, dtxt)
              dtxt = raise_dts(r'(\bac_charger_current\s*=\s*<)(\d+)(>;)', 2050000, dtxt)
              dtxt = raise_dts(r'(\bnon_std_ac_charger_current\s*=\s*<)(\d+)(>;)', 2000000, dtxt)
              dtxt = raise_dts(r'(\bcharging_host_charger_current\s*=\s*<)(\d+)(>;)', 2000000, dtxt)
              dtxt = raise_dts(r'(\bapple_2_1a_charger_current\s*=\s*<)(\d+)(>;)', 2050000, dtxt)
              dtxt = re.sub(r'(\bbattery_cv\s*=\s*<)\d+(>;)', r'\g<1>4400000\g<2>', dtxt)
              dtxt = raise_dts(r'(\bjeita_temp_t1_to_t2_cc\s*=\s*<)(\d+)(>;)', 2050000, dtxt)
              dtxt = raise_dts(r'(\bjeita_temp_t2_to_t3_cc\s*=\s*<)(\d+)(>;)', 2050000, dtxt)
              dtxt = raise_dts(r'(\bjeita_temp_t3_to_t4_cc\s*=\s*<)(\d+)(>;)', 1500000, dtxt)
              dtxt = re.sub(r'(\bjeita_temp_t1_to_t2_cv\s*=\s*<)\d+(>;)', r'\g<1>4400000\g<2>', dtxt)
              dtxt = re.sub(r'(\bjeita_temp_t2_to_t3_cv\s*=\s*<)\d+(>;)', r'\g<1>4400000\g<2>', dtxt)
              dtxt = re.sub(r'(\bjeita_temp_t3_to_t4_cv\s*=\s*<)\d+(>;)', r'\g<1>4200000\g<2>', dtxt)
              if dtxt != orig_d:
                  with open(dts_f, 'w') as f:
                      f.write(dtxt)
                  print(f"Patched DTS charger & JEITA CC/CV limit in {dts_f} OK")

          # 6. Suntikkan helper madara_disable_ppm_policies() & lock policy 1-3 di mtk_ppm_interface.c
          for ppm_f in glob.glob('drivers/misc/mediatek/**/ppm_v3/src/mtk_ppm_interface.c', recursive=True):
              with open(ppm_f, 'r', errors='ignore') as f:
                  ptxt = f.read()
              if 'ppm_policy_status_proc_show' in ptxt and 'madara_disable_ppm_policies' not in ptxt:
                  helper_fn = (
                      'void madara_disable_ppm_policies(void)\n'
                      '{\n'
                      '\tstruct ppm_policy_data *l_pos;\n'
                      '\tbool changed = false;\n\n'
                      '\tppm_lock(&ppm_main_info.lock);\n'
                      '\tlist_for_each_entry(l_pos, &ppm_main_info.policy_list, link) {\n'
                      '\t\tif (l_pos->policy >= 1 && l_pos->policy <= 3 && l_pos->is_enabled) {\n'
                      '\t\t\tppm_lock(&l_pos->lock);\n'
                      '\t\t\tl_pos->is_enabled = false;\n'
                      '\t\t\tif (l_pos->status_change_cb)\n'
                      '\t\t\t\tl_pos->status_change_cb(false);\n'
                      '\t\t\tppm_unlock(&l_pos->lock);\n'
                      '\t\t\tchanged = true;\n'
                      '\t\t}\n'
                      '\t}\n'
                      '\tppm_unlock(&ppm_main_info.lock);\n'
                      '\tif (changed)\n'
                      '\t\tmt_ppm_main();\n'
                      '}\n'
                      'EXPORT_SYMBOL(madara_disable_ppm_policies);\n\n'
                  )
                  ptxt = ptxt.replace('static int ppm_policy_status_proc_show', helper_fn + 'static int ppm_policy_status_proc_show', 1)
                  ptxt = re.sub(
                      r'(if\s*\(enabled\s*>\s*1\)\s*enabled\s*=\s*1;)',
                      r'\1\n\t\tif (policy_idx >= 1 && policy_idx <= 3)\n\t\t\tenabled = 0;',
                      ptxt,
                      count=1
                  )
                  with open(ppm_f, 'w') as f:
                      f.write(ptxt)
                  print(f"Patched madara_disable_ppm_policies in {ppm_f} OK")

          # Fix missing linux/gfp.h in MTK performance utility.c
          util_c = 'drivers/misc/mediatek/performance/base/utility.c'
          try:
              with open(util_c, 'r') as f:
                  utxt = f.read()
              if '#include <linux/gfp.h>' not in utxt:
                  utxt = '#include <linux/gfp.h>\n' + utxt
                  with open(util_c, 'w') as f:
                      f.write(utxt)
                  print('Patched linux/gfp.h in utility.c OK')
          except FileNotFoundError:
              pass

          # Izinkan ANDROID_SIMPLE_LMK aktif bersamaan dengan CONFIG_MEMCG & CONFIG_PSI
          kconfig_path = 'drivers/android/Kconfig'
          if os.path.exists(kconfig_path):
              with open(kconfig_path, 'r') as f:
                  ktxt = f.read()
              def unlock_slmk(m):
                  blk = m.group(0)
                  blk = re.sub(r'!MEMCG\s*&&\s*!PSI|!PSI\s*&&\s*!MEMCG|!MEMCG|!PSI', 'y', blk)
                  blk = re.sub(r'\by\s*&&\s*y\b', 'y', blk)
                  return blk
              ktxt_new, nk = re.subn(r'config ANDROID_SIMPLE_LMK\b.*?(?=\nconfig |\nendmenu|\Z)', unlock_slmk, ktxt, flags=re.S)
              if nk:
                  with open(kconfig_path, 'w') as f:
                      f.write(ktxt_new)
                  print("Patched ANDROID_SIMPLE_LMK Kconfig dependencies OK")
              m_blk = re.search(r'config ANDROID_SIMPLE_LMK\b.*?(?=\nconfig |\nendmenu|\Z)', ktxt_new, flags=re.S)
              if m_blk:
                  print("=== Kconfig ANDROID_SIMPLE_LMK ===\n" + m_blk.group(0).strip() + "\n==================================")

          android_mk = 'drivers/android/Makefile'
          if os.path.exists(android_mk):
              with open(android_mk, 'r') as f:
                  amk = f.read()
              if 'simple_lmk.o' not in amk:
                  amk += '\nobj-$(CONFIG_ANDROID_SIMPLE_LMK) += simple_lmk.o\n'
                  with open(android_mk, 'w') as f:
                      f.write(amk)
                  print("Added simple_lmk.o to drivers/android/Makefile OK")

          slmk_c = 'drivers/android/simple_lmk.c'
          if os.path.exists(slmk_c):
              with open(slmk_c, 'r') as f:
                  stxt = f.read()
              # Batasi kill hanya untuk proses background/cached (adj >= 750), lindungi foreground, IME & launcher
              stxt, n_adj = re.subn(r'\bif\s*\(\s*adj\s*<\s*0\s*\|\|', 'if (adj < 750 ||', stxt, count=1)
              # Tambahkan cooldown 1500ms di scan_and_kill() agar ZRAM/MGLRU sempat bekerja sebelum kill beruntun
              stxt, n_cd = re.subn(
                  r'(static\s+void\s+scan_and_kill\s*\(\s*void\s*\)\s*\{\n)',
                  r'\1\tstatic unsigned long last_reclaim;\n'
                  r'\tif (last_reclaim && time_before(jiffies, last_reclaim + msecs_to_jiffies(1500)))\n'
                  r'\t\treturn;\n'
                  r'\tlast_reclaim = jiffies;\n\n',
                  stxt,
                  count=1
              )
              with open(slmk_c, 'w') as f:
                  f.write(stxt)
              print(f"Patched simple_lmk.c (min_adj>=750: {n_adj}x, cooldown_1500ms: {n_cd}x) OK")

          # Ensure read_ahead_kb sysfs attribute is writable (0644 instead of 0444)
          blk_sysfs = 'block/blk-sysfs.c'
          try:
              with open(blk_sysfs, 'r') as f:
                  btxt = f.read()
              btxt_new, n = re.subn(
                  r'QUEUE_RO_ENTRY\(\s*queue_read_ahead\s*,\s*"read_ahead_kb"\s*\)',
                  '__ATTR(read_ahead_kb, 0644, queue_read_ahead_show, queue_read_ahead_store)',
                  btxt
              )
              if n == 0 and 'queue_read_ahead' in btxt:
                  btxt_new = re.sub(r'(\bqueue_read_ahead_entry\.attr\.mode\s*=\s*)0444', r'\g<1>0644', btxt)
                  if btxt_new == btxt:
                      btxt_new = re.sub(r'(QUEUE_RO_ENTRY\([^)]*read_ahead_kb[^)]*\))', lambda m: m.group(0).replace('0444', '0644'), btxt)
              if btxt_new != btxt:
                  with open(blk_sysfs, 'w') as f:
                      f.write(btxt_new)
                  print('Patched read_ahead_kb sysfs mode to 0644 OK')
          except FileNotFoundError:
              pass

          PY

          # 7. Buat driver madara_tweaks.c (Fast Storage Read + RAM + CPU + Power Lock)
          cat << 'EOF' > drivers/misc/madara_tweaks.c
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/init.h>
          #include <linux/string.h>
          #include <linux/workqueue.h>
          #include <linux/fs.h>
          #include <linux/uaccess.h>
          #include <linux/proc_fs.h>
          #include <linux/seq_file.h>
          #include <net/net_namespace.h>
          #include <net/tcp.h>

          extern void __weak madara_disable_ppm_policies(void);

          extern int vm_swappiness;
          static int madara_pass;
          static struct delayed_work madara_work;

          static void madara_write_sysfs(const char *path, const char *val)
          {
          	struct file *fp;
          	loff_t pos = 0;
          	mm_segment_t old_fs = get_fs();

          	set_fs(KERNEL_DS);
          	fp = filp_open(path, O_WRONLY, 0);
          	if (!IS_ERR(fp)) {
          		kernel_write(fp, val, strlen(val), &pos);
          		filp_close(fp, NULL);
          	}
          	set_fs(old_fs);
          }

          static void madara_apply_tweaks(struct work_struct *work)
          {
          	vm_swappiness = 100;
          	tcp_set_default_congestion_control(&init_net, "bbr");

          	if (madara_disable_ppm_policies)
          		madara_disable_ppm_policies();

          	/* Storage Read & Low-Latency Block Queue */
          	madara_write_sysfs("/sys/block/mmcblk0/queue/scheduler", "none");
          	madara_write_sysfs("/sys/block/mmcblk0/queue/read_ahead_kb", "128");
          	madara_write_sysfs("/sys/block/mmcblk0/queue/iostats", "0");
          	madara_write_sysfs("/sys/block/mmcblk0/queue/add_random", "0");
          	madara_write_sysfs("/sys/block/mmcblk0/queue/rq_affinity", "2");

          	/* RAM Management (2GB + ZRAM LZ4) */
          	madara_write_sysfs("/proc/sys/vm/vfs_cache_pressure", "85");
          	madara_write_sysfs("/proc/sys/vm/watermark_scale_factor", "10");
          	madara_write_sysfs("/proc/sys/vm/watermark_boost_factor", "0");
          	madara_write_sysfs("/proc/sys/vm/min_free_kbytes", "8192");

          	/* Interactive CPU Boost + Fast Down-Ramp untuk Efisiensi Daya */
          	madara_write_sysfs("/sys/devices/system/cpu/cpufreq/schedutil/up_rate_limit_us", "500");
          	madara_write_sysfs("/sys/devices/system/cpu/cpufreq/schedutil/down_rate_limit_us", "2500");
          	madara_write_sysfs("/sys/devices/system/cpu/cpufreq/schedutil/hispeed_freq", "2300000");
          	madara_write_sysfs("/sys/devices/system/cpu/cpufreq/schedutil/hispeed_load", "78");

          	/* Charging & JEITA Runtime Enforcement */
          	madara_write_sysfs("/sys/devices/platform/charger/power_supply/mtk-master-charger/input_current_limit", "2400000");

          	/* Power Efficient Workqueues */
          	madara_write_sysfs("/sys/module/workqueue/parameters/power_efficient", "Y");

          	/* Network */
          	madara_write_sysfs("/proc/sys/net/ipv4/tcp_low_latency", "1");
          	madara_write_sysfs("/proc/sys/net/ipv4/tcp_fastopen", "3");

          	madara_pass++;
          	if (madara_pass == 1)
          		schedule_delayed_work(&madara_work, msecs_to_jiffies(35000));
          	pr_info("madara_tweaks: pass %d applied\n", madara_pass);
          }

          static int madara_status_show(struct seq_file *m, void *v)
          {
          	if (madara_pass >= 2)
          		seq_puts(m, "active (locked)\n");
          	else if (madara_pass == 1)
          		seq_puts(m, "active (pass 1)\n");
          	else
          		seq_puts(m, "pending\n");
          	return 0;
          }

          static int madara_status_open(struct inode *inode, struct file *file)
          {
          	return single_open(file, madara_status_show, NULL);
          }

          static const struct file_operations madara_status_fops = {
          	.owner = THIS_MODULE,
          	.open = madara_status_open,
          	.read = seq_read,
          	.llseek = seq_lseek,
          	.release = single_release,
          };

          static int __init madara_tweaks_init(void)
          {
          	proc_create("madara_status", 0444, NULL, &madara_status_fops);
          	INIT_DELAYED_WORK(&madara_work, madara_apply_tweaks);
          	schedule_delayed_work(&madara_work, msecs_to_jiffies(25000));
          	return 0;
          }
          late_initcall(madara_tweaks_init);
          EOF
          echo 'obj-y += madara_tweaks.o' >> drivers/misc/Makefile

      - name: Setup Variant (${{ matrix.variant }})
        working-directory: kernel
        run: |
          if [ "${{ matrix.variant }}" == "RSKSU-SusFS" ]; then
            KSU_REF="d5e9e025b8b49155f8014684d64c91742b465f65"
            curl -LSs \
              "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
              | bash -s "$KSU_REF"

            git clone --depth=1 \
              https://github.com/fabiannabil1/susfs-4.19-nongki.git \
              susfs419

            SUSFS_PATCH="$PWD/susfs419/patches/lge-sm8250-29902cf733dc/0002-susfs-v2.3.0-4.19.patch"
            [ -f "$SUSFS_PATCH" ] || { echo "ERROR: Patch SUSFS tidak ditemukan!"; exit 1; }

            python3 - "$SUSFS_PATCH" << 'PY'
          import re, sys, subprocess
          with open(sys.argv[1], "r", encoding="utf-8", errors="replace") as f:
              patch_text = f.read()
          chunks = re.split(r"(?=^diff --git )", patch_text, flags=re.MULTILINE)
          filtered_chunks = []
          for chunk in chunks:
              if not chunk.strip(): continue
              lines = chunk.splitlines(keepends=True)
              first_line = lines[0].strip()
              if re.match(r"^diff --git a/fs/proc/cmdline\.c b/fs/proc/cmdline\.c$", first_line):
                  continue
              if re.match(r"^diff --git a/fs/namespace\.c b/fs/namespace\.c$", first_line):
                  output = []
                  skip_hunk = False
                  for line in lines:
                      if line.startswith("@@ "):
                          skip_hunk = ("vfs_create_mount" in line)
                      if not skip_hunk:
                          output.append(line)
                  filtered_chunks.append("".join(output))
              else:
                  filtered_chunks.append(chunk)
          res = subprocess.run(["patch", "-p1", "--no-backup-if-mismatch", "-F3"], input="\n".join(filtered_chunks), text=True)
          if res.returncode != 0:
              sys.exit("ERROR: Patch SUSFS gagal.")
          PY

            if find . -name "*.rej" -not -path "./susfs419/*" | grep -q .; then
              find . -name "*.rej" -not -path "./susfs419/*" -exec head -n 80 {} +
              exit 1
            fi

            if ! grep -q "susfs.o" fs/Makefile; then
              echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
            fi

            python3 - << 'EOF'
          import os, re
          pkg_obs = 'drivers/kernelsu/manager/pkg_observer.c'
          if os.path.exists(pkg_obs):
              with open(pkg_obs, 'r') as f: code = f.read()
              code = code.replace('TWA_RESUME', 'true')
              if '.handle_inode_event' in code:
                  wrapper = (
                      'static int ksu_handle_event_419(struct fsnotify_group *group, struct inode *inode, '
                      'u32 mask, const void *data, int data_type, const unsigned char *file_name, '
                      'u32 cookie, struct fsnotify_iter_info *iter_info)\n{\n'
                      '\tstruct qstr qname = { .name = file_name, .len = file_name ? strlen(file_name) : 0 };\n'
                      '\treturn ksu_handle_inode_event(NULL, mask, inode, inode, file_name ? &qname : NULL, cookie);\n}\n\n'
                      'static const struct fsnotify_ops'
                  )
                  code = code.replace('static const struct fsnotify_ops', wrapper, 1)
                  code = re.sub(r'\.handle_inode_event\s*=\s*ksu_handle_inode_event', '.handle_event = ksu_handle_event_419', code)
              with open(pkg_obs, 'w') as f: f.write(code)

          with open('fs/namei.c', 'r') as f: namei = f.read()
          namei_new, n = re.subn(r'\bstatic\s+(int\s+filename_lookup\s*\()', r'\1', namei)
          if n:
              with open('fs/namei.c', 'w') as f: f.write(namei_new)

          decl = '\nextern int filename_lookup(int dfd, struct filename *name, unsigned flags, struct path *path, struct path *root);\n'
          for target in ['fs/open.c', 'fs/stat.c']:
              with open(target, 'r') as f: code = f.read()
              if 'extern int filename_lookup(' not in code:
                  includes = list(re.finditer(r'^#include\s+[<"].*?[>"]', code, flags=re.MULTILINE))
                  last_inc_end = includes[-1].end()
                  code = code[:last_inc_end] + decl + code[last_inc_end:]
                  with open(target, 'w') as f: f.write(code)
          EOF

            cat << 'EOF' >> arch/arm64/configs/blossom_defconfig
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          # CONFIG_KSU_SUSFS_SUS_MOUNT is not set
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          # CONFIG_KPROBES is not set
          EOF
            sed -i 's/--dirty//g; s/-dirty//g' KernelSU/kernel/Kbuild KernelSU/kernel/Makefile drivers/kernelsu/Kbuild drivers/kernelsu/Makefile 2>/dev/null || true
            if [ -n "${{ secrets.ZEXSU_SIZE }}" ] && [ -n "${{ secrets.ZEXSU_HASH }}" ]; then
              python3 - "${{ secrets.ZEXSU_SIZE }}" "${{ secrets.ZEXSU_HASH }}" << 'PY'
          import glob, re, sys
          z_size, z_hash = sys.argv[1], sys.argv[2]
          for path in glob.glob('**/apk_sign.c', recursive=True):
              with open(path, 'r', errors='ignore') as f:
                  code = f.read()
              if z_hash in code:
                  continue
              new_code, n = re.subn(
                  r'(return\s+check_v2_signature\s*\(\s*path\s*,\s*EXPECTED_SIZE\s*,\s*EXPECTED_HASH\s*\)\s*;)',
                  f'if (check_v2_signature(path, {z_size}, \"{z_hash}\")) return true;\\n\\t\\1',
                  code
              )
              if not n:
                  new_code, n = re.subn(
                      r'(check_v2_signature\s*\(\s*path\s*,\s*EXPECTED_SIZE\s*,\s*EXPECTED_HASH\s*\))',
                      f'(\1 || check_v2_signature(path, {z_size}, "{z_hash}"))',
                      code
                  )
              if n:
                  with open(path, 'w') as f:
                      f.write(new_code)
                  print(f"Patched Dual-Signature (BakaSU + ZexSU) in {path} OK")
          PY
            fi
          fi

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="ZexxaDev"
          export KBUILD_BUILD_HOST="GitHubActions"
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G

          sed -i '/CONFIG_DEFAULT_BIC/d;/CONFIG_DEFAULT_CUBIC/d;/CONFIG_DEFAULT_RENO/d;/CONFIG_DEFAULT_TCP_CONG/d' arch/arm64/configs/blossom_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 blossom_defconfig

          ./scripts/config --file out/.config \
            -e TCP_CONG_ADVANCED \
            -e TCP_CONG_BBR \
            -e DEFAULT_BBR \
            -d DEFAULT_BIC \
            -d DEFAULT_CUBIC \
            -d DEFAULT_RENO \
            --set-str DEFAULT_TCP_CONG "bbr" \
            -e NET_SCH_FQ \
            -e NET_SCH_DEFAULT \
            -e DEFAULT_FQ \
            --set-str DEFAULT_NET_SCH "fq" \
            -e WQ_POWER_EFFICIENT_DEFAULT \
            -e NO_HZ_IDLE \
            -e CPU_IDLE \
            -e PM_WAKELOCKS_GC \
            -e JUMP_LABEL \
            -e UCLAMP_TASK \
            -e UCLAMP_TASK_GROUP \
            -e ANDROID_SIMPLE_LMK \
            --set-val ANDROID_SIMPLE_LMK_MINFREE 12 \
            --set-val ANDROID_SIMPLE_LMK_TIMEOUT_MSEC 1000 \
            -d ANDROID_LOW_MEMORY_KILLER \
            -e LRU_GEN \
            -e LRU_GEN_ENABLED \
            -e ZRAM_DEDUP \
            -e SWAP_VMA_READAHEAD \
            -e CRYPTO_LZ4 \
            -d SLUB_DEBUG \
            -d SLUB_DEBUG_ON \
            -d SCHED_DEBUG \
            -d SCHEDSTATS \
            -e KALLSYMS_ALL \
            -d DEBUG_PREEMPT \
            -d DEBUG_LIST \
            --set-str LOCALVERSION "-madaraRikudou-v1.5" \
            -d LOCALVERSION_AUTO

          make -j$(nproc --all) O=out ARCH=arm64 olddefconfig
          {
            echo "### Simple LMK Build Report (${{ matrix.variant }})"
            echo '```'
            grep -E '^CONFIG_ANDROID_SIMPLE_LMK|^CONFIG_PSI=|^CONFIG_MEMCG=' out/.config || echo 'MISSING_SIMPLE_LMK'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK=y' out/.config || { echo 'ERROR: CONFIG_ANDROID_SIMPLE_LMK=y terhapus oleh olddefconfig!'; exit 1; }

          if [ "${{ matrix.variant }}" == "RSKSU-SusFS" ]; then
            grep -q "^CONFIG_KSU=y" out/.config || exit 1
            grep -q "^CONFIG_KSU_SUSFS=y" out/.config || exit 1
          fi

          set -o pipefail
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            KCFLAGS="-march=armv8-a+crc+crypto -mtune=cortex-a53" \
            LOCALVERSION="" \
            CC="ccache clang" \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz-dtb 2>&1 | tee build.log || {
              grep -iE "error:|undefined symbol|undefined reference" build.log | tail -n 25
              exit 1
            }

          {
            echo '#### Compile Log (simple_lmk)'
            echo '```'
            grep -i 'simple_lmk' build.log || echo 'Tidak ada baris khusus simple_lmk di build.log'
            ls -lh out/drivers/android/simple_lmk.o 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f out/drivers/android/simple_lmk.o ] || { echo 'ERROR: out/drivers/android/simple_lmk.o tidak terkompilasi!'; exit 1; }
          if grep -q '^CONFIG_ANDROID_SIMPLE_LMK=y' out/.config && [ -f out/drivers/android/simple_lmk.o ]; then
            echo 'SLMK_STATUS=ACTIVE (minfree=12MB, timeout=1000ms, min_adj=750)' >> "$GITHUB_ENV"
          else
            echo 'SLMK_STATUS=FAILED' >> "$GITHUB_ENV"
          fi
          ccache -s

