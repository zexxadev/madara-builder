      - name: Publish to niigo_kernel_xiaomi_blossom
        uses: softprops/action-gh-release@v2
        with:
          repository: zexxadev/niigo_kernel_xiaomi_blossom
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: madaraRikudou-b${{ github.run_number }}
          name: madaraRikudou Blossom (Build #${{ github.run_number }})
