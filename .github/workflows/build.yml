name: Build madaraKernel Blossom (Dual-Variant)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [Vanilla, RSKSU-SusFS]

    steps:
      - name: Checkout Builder Repo (for Changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          path: builder

      - name: Generate Auto-Changelog
        run: |
          cd builder
          LOGS=$(git log -n 5 --pretty=format:"• %s")
          {
            echo "CHANGELOG<<EOF"
            echo "$LOGS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 zip unzip

      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: proton-clang-v1

      - name: Clone Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone Kernel Source (niigo_yoka)
        run: |
          git clone --depth=1 -b niigo_yoka https://github.com/zexxadev/niigo_kernel_xiaomi_blossom.git kernel

      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-blossom-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-blossom-${{ matrix.variant }}-

      - name: Inject Performance, OC, Driver & VM Defaults to Source
        working-directory: kernel
        run: |
          python3 - << 'EOF'
          import glob
          import re

          def patch_file(path, pattern, repl, desc):
              try:
                  with open(path, 'r') as f:
                      txt = f.read()
                  new_txt, n = re.subn(pattern, repl, txt)
                  if n:
                      with open(path, 'w') as f:
                          f.write(new_txt)
                      print(f"Patched {desc} in {path} ({n}x) OK")
              except FileNotFoundError:
                  pass

          # 1. Scheduler: Matikan GENTLE_FAIR_SLEEPERS & aktifkan NEXT_BUDDY
          feat_file = 'kernel/sched/features.h'
          with open(feat_file, 'r') as f:
              feat = f.read()
          feat, n1 = re.subn(r'(#define\s+SCHED_FEAT_GENTLE_FAIR_SLEEPERS\s+)1\b', r'\g<1>0', feat)
          if not n1:
              feat, n1 = re.subn(r'SCHED_FEAT\(\s*GENTLE_FAIR_SLEEPERS\s*,\s*true\s*\)', 'SCHED_FEAT(GENTLE_FAIR_SLEEPERS, false)', feat)
          feat, n2 = re.subn(r'(#define\s+SCHED_FEAT_NEXT_BUDDY\s+)0\b', r'\g<1>1', feat)
          if not n2:
              feat, n2 = re.subn(r'SCHED_FEAT\(\s*NEXT_BUDDY\s*,\s*false\s*\)', 'SCHED_FEAT(NEXT_BUDDY, true)', feat)
          with open(feat_file, 'w') as f:
              f.write(feat)
          print(f"Patched Sched Features (GENTLE={n1}, NEXT_BUDDY={n2}) OK")

          # 2. GPU Overclock PowerVR GE8320 -> 730 MHz
          for pattern in ['drivers/misc/mediatek/**/*.[ch]', 'drivers/gpu/**/*.[ch]']:
              for path in glob.glob(pattern, recursive=True):
                  if 'cpufreq' in path or 'eem' in path:
                      continue
                  with open(path, 'r', errors='ignore') as f:
                      txt = f.read()
                  if not any(k in txt for k in ('GPU_DVFS', 'gpufreq', 'mtk_gpufreq', 'rgx_mtk', 'mfg')):
                      continue
                  new_txt, n_g = re.subn(
                      r'(#define\s+(?:SEG_)?GPU_DVFS_FREQ0\s*\(?\s*)(?:650000|600000|520000)(\s*\)?)',
                      r'\g<1>730000\g<2>',
                      txt
                  )
                  if not n_g and ('gpu' in path.lower() or 'mfg' in path.lower()):
                      new_txt, n_g = re.subn(r'\b650000\b', '730000', txt)
                  if n_g:
                      with open(path, 'w') as f:
                          f.write(new_txt)
                      print(f"Patched GPU OC 730MHz in {path} ({n_g}x) OK")

          for dts in glob.glob('arch/arm64/boot/dts/**/*.dts*', recursive=True):
              with open(dts, 'r', errors='ignore') as f:
                  d_txt = f.read()
              if '650000000' in d_txt and ('gpu' in d_txt.lower() or 'mfg' in d_txt.lower()):
                  d_new, n_dts = re.subn(r'\b650000000\b', '730000000', d_txt)
                  if n_dts:
                      with open(dts, 'w') as f:
                          f.write(d_new)
                      print(f"Patched GPU DTS OPP 730MHz in {dts} OK")

          # 3. CPU Overclock Little Cluster (1.5 GHz -> 1.8 GHz)
          for cpu_f in glob.glob('drivers/misc/mediatek/base/power/cpufreq_v1/**/*.[ch]', recursive=True):
              patch_file(cpu_f, r'\b1500000\b', '1800000', 'Little CPU OC 1.8GHz')

          # 4. Bake VM, Block I/O (none) & Power Defaults langsung ke C Source
          patch_file('mm/vmscan.c', r'\bint\s+vm_swappiness\s*=\s*60\s*;', 'int vm_swappiness = 120;', 'vm_swappiness=120')
          patch_file('mm/swap.c', r'\bint\s+page_cluster\s*=\s*3\s*;', 'int page_cluster = 0;', 'page-cluster=0')
          patch_file('mm/page-writeback.c', r'\bint\s+vm_dirty_ratio\s*=\s*20\s*;', 'int vm_dirty_ratio = 15;', 'dirty_ratio=15')
          patch_file('mm/page-writeback.c', r'\bint\s+dirty_background_ratio\s*=\s*10\s*;', 'int dirty_background_ratio = 5;', 'dirty_background_ratio=5')
          patch_file('kernel/power/suspend.c', r'\bbool\s+sync_on_suspend\s*=\s*true\s*;', 'bool sync_on_suspend = false;', 'sync_on_suspend=false')
          patch_file('kernel/sched/fair.c', r'\bunsigned\s+int\s+sysctl_timer_migration\s*=\s*1\s*;', 'unsigned int sysctl_timer_migration = 0;', 'timer_migration=0')
          patch_file('block/elevator.c', r'elevator_get\(\s*q\s*,\s*"mq-deadline"\s*,\s*false\s*\)', 'NULL', 'blk-mq default none')

          # 5. Deep Sleep Wakelock Blocker
          wakeup_file = 'drivers/base/power/wakeup.c'
          with open(wakeup_file, 'r') as f:
              w_code = f.read()

          blocker_fn = (
              'static bool madara_is_blocked_wakelock(const char *name)\n'
              '{\n'
              '\tif (!name)\n'
              '\t\treturn false;\n'
              '\tif (!strcmp(name, "NETLINK") ||\n'
              '\t    !strcmp(name, "wlan_rx_wake") ||\n'
              '\t    !strcmp(name, "wlan_ctrl_wake") ||\n'
              '\t    !strcmp(name, "wlan_wake") ||\n'
              '\t    !strcmp(name, "SensorService") ||\n'
              '\t    !strncmp(name, "eventpoll", 9))\n'
              '\t\treturn true;\n'
              '\treturn false;\n'
              '}\n\n'
          )

          if 'madara_is_blocked_wakelock' not in w_code:
              w_new, nw = re.subn(
                  r'(static\s+void\s+wakeup_source_activate\s*\(\s*struct\s+wakeup_source\s*\*\s*ws\s*\)\s*\{)',
                  blocker_fn + r'\1\n\tif (madara_is_blocked_wakelock(ws->name))\n\t\treturn;',
                  w_code,
                  count=1
              )
              if nw:
                  with open(wakeup_file, 'w') as f:
                      f.write(w_new)
                  print("Patched Deep Sleep Wakelock Blocker OK")

          # 6. Cari & export fungsi pengubah status policy di driver MTK PPM
          for ppm_f in glob.glob('drivers/misc/mediatek/base/power/ppm*/**/*.c', recursive=True):
              with open(ppm_f, 'r', errors='ignore') as f:
                  ptxt = f.read()
              if 'policy_status_proc_write' in ptxt:
                  # Cari fungsi yang memodifikasi is_activated / policy_status
                  candidates = re.findall(r'\b([a-zA-Z0-9_]*(?:policy|activate)[a-zA-Z0-9_]*status[a-zA-Z0-9_]*)\s*\(', ptxt, flags=re.IGNORECASE)
                  for fn_name in candidates:
                      if 'proc' in fn_name.lower() or 'show' in fn_name.lower() or 'read' in fn_name.lower():
                          continue
                      if f'EXPORT_SYMBOL({fn_name})' not in ptxt:
                          ptxt += f'\nEXPORT_SYMBOL({fn_name});\n'
                          with open(ppm_f, 'w') as f:
                              f.write(ptxt)
                      with open('drivers/misc/madara_ppm_api.h', 'w') as hf:
                          hf.write(f'#define MADARA_PPM_FN {fn_name}\n')
                      print(f"Exported PPM helper {fn_name} from {ppm_f}")
                      break
          EOF

          # 7. Buat driver madara_tweaks.c (Direct Kernel API + Memory Variable Override)
          cat << 'EOF' > drivers/misc/madara_tweaks.c
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/init.h>
          #include <linux/string.h>
          #include <linux/workqueue.h>
          #include <linux/fs.h>
          #include <linux/proc_fs.h>
          #include <linux/seq_file.h>
          #include <net/net_namespace.h>
          #include <net/tcp.h>

          #if __has_include("madara_ppm_api.h")
          #include "madara_ppm_api.h"
          extern void MADARA_PPM_FN(unsigned int id, bool enable);
          #endif

          extern int vm_swappiness;
          static int madara_pass;
          static struct delayed_work madara_work;

          static void madara_write_sysfs(const char *path, const char *val)
          {
          	struct file *fp;
          	loff_t pos = 0;

          	fp = filp_open(path, O_WRONLY, 0);
          	if (IS_ERR(fp))
          		return;

          	kernel_write(fp, val, strlen(val), &pos);
          	filp_close(fp, NULL);
          }

          static void madara_apply_tweaks(struct work_struct *work)
          {
          	/* 1. Kunci vm_swappiness langsung di variabel kernel */
          	vm_swappiness = 120;

          	/* 2. Paksa TCP BBR langsung lewat API networking kernel */
          	tcp_set_default_congestion_control(&init_net, "bbr");

          	/* 3. Matikan MTK PPM Policy 1-3 langsung lewat API driver MTK */
          #ifdef MADARA_PPM_FN
          	MADARA_PPM_FN(1, false);
          	MADARA_PPM_FN(2, false);
          	MADARA_PPM_FN(3, false);
          #endif
          	madara_write_sysfs("/proc/ppm/policy_status", "1 0\n");
          	madara_write_sysfs("/proc/ppm/policy_status", "2 0\n");
          	madara_write_sysfs("/proc/ppm/policy_status", "3 0\n");

          	/* 4. Kunci I/O & Schedutil di sysfs */
          	madara_write_sysfs("/sys/block/mmcblk0/queue/scheduler", "none");
          	madara_write_sysfs("/sys/block/mmcblk0/queue/read_ahead_kb", "128");
          	madara_write_sysfs("/sys/devices/system/cpu/cpufreq/schedutil/up_rate_limit_us", "500");
          	madara_write_sysfs("/sys/devices/system/cpu/cpufreq/schedutil/down_rate_limit_us", "2000");
          	madara_write_sysfs("/sys/devices/system/cpu/cpufreq/schedutil/hispeed_freq", "1800000");
          	madara_write_sysfs("/sys/devices/system/cpu/cpufreq/schedutil/hispeed_load", "75");

          	madara_pass++;
          	if (madara_pass == 1)
          		schedule_delayed_work(&madara_work, msecs_to_jiffies(35000));
          	pr_info("madara_tweaks: pass %d applied\n", madara_pass);
          }

          static int madara_status_show(struct seq_file *m, void *v)
          {
          	if (madara_pass >= 2)
          		seq_puts(m, "active (locked)\n");
          	else if (madara_pass == 1)
          		seq_puts(m, "active (pass 1)\n");
          	else
          		seq_puts(m, "pending\n");
          	return 0;
          }

          static int madara_status_open(struct inode *inode, struct file *file)
          {
          	return single_open(file, madara_status_show, NULL);
          }

          static const struct file_operations madara_status_fops = {
          	.owner = THIS_MODULE,
          	.open = madara_status_open,
          	.read = seq_read,
          	.llseek = seq_lseek,
          	.release = single_release,
          };

          static int __init madara_tweaks_init(void)
          {
          	proc_create("madara_status", 0444, NULL, &madara_status_fops);
          	INIT_DELAYED_WORK(&madara_work, madara_apply_tweaks);
          	schedule_delayed_work(&madara_work, msecs_to_jiffies(25000));
          	return 0;
          }
          late_initcall(madara_tweaks_init);
          EOF
          echo 'obj-y += madara_tweaks.o' >> drivers/misc/Makefile

      - name: Setup Variant (${{ matrix.variant }})
        working-directory: kernel
        run: |
          if [ "${{ matrix.variant }}" == "RSKSU-SusFS" ]; then
            KSU_REF="d5e9e025b8b49155f8014684d64c91742b465f65"
            curl -LSs \
              "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
              | bash -s "$KSU_REF"

            git clone --depth=1 \
              https://github.com/fabiannabil1/susfs-4.19-nongki.git \
              susfs419

            SUSFS_PATCH="$PWD/susfs419/patches/lge-sm8250-29902cf733dc/0002-susfs-v2.3.0-4.19.patch"
            [ -f "$SUSFS_PATCH" ] || { echo "ERROR: Patch SUSFS tidak ditemukan!"; exit 1; }

            python3 - "$SUSFS_PATCH" << 'PY'
          import re, sys, subprocess
          with open(sys.argv[1], "r", encoding="utf-8", errors="replace") as f:
              patch_text = f.read()
          chunks = re.split(r"(?=^diff --git )", patch_text, flags=re.MULTILINE)
          filtered_chunks = []
          for chunk in chunks:
              if not chunk.strip(): continue
              lines = chunk.splitlines(keepends=True)
              first_line = lines[0].strip()
              if re.match(r"^diff --git a/fs/proc/cmdline\.c b/fs/proc/cmdline\.c$", first_line):
                  continue
              if re.match(r"^diff --git a/fs/namespace\.c b/fs/namespace\.c$", first_line):
                  output = []
                  skip_hunk = False
                  for line in lines:
                      if line.startswith("@@ "):
                          skip_hunk = ("vfs_create_mount" in line)
                      if not skip_hunk:
                          output.append(line)
                  filtered_chunks.append("".join(output))
              else:
                  filtered_chunks.append(chunk)
          res = subprocess.run(["patch", "-p1", "--no-backup-if-mismatch", "-F3"], input="\n".join(filtered_chunks), text=True)
          if res.returncode != 0:
              sys.exit("ERROR: Patch SUSFS gagal.")
          PY

            if find . -name "*.rej" -not -path "./susfs419/*" | grep -q .; then
              find . -name "*.rej" -not -path "./susfs419/*" -exec head -n 80 {} +
              exit 1
            fi

            if ! grep -q "susfs.o" fs/Makefile; then
              echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
            fi

            python3 - << 'EOF'
          import os, re
          pkg_obs = 'drivers/kernelsu/manager/pkg_observer.c'
          if os.path.exists(pkg_obs):
              with open(pkg_obs, 'r') as f: code = f.read()
              code = code.replace('TWA_RESUME', 'true')
              if '.handle_inode_event' in code:
                  wrapper = (
                      'static int ksu_handle_event_419(struct fsnotify_group *group, struct inode *inode, '
                      'u32 mask, const void *data, int data_type, const unsigned char *file_name, '
                      'u32 cookie, struct fsnotify_iter_info *iter_info)\n{\n'
                      '\tstruct qstr qname = { .name = file_name, .len = file_name ? strlen(file_name) : 0 };\n'
                      '\treturn ksu_handle_inode_event(NULL, mask, inode, inode, file_name ? &qname : NULL, cookie);\n}\n\n'
                      'static const struct fsnotify_ops'
                  )
                  code = code.replace('static const struct fsnotify_ops', wrapper, 1)
                  code = re.sub(r'\.handle_inode_event\s*=\s*ksu_handle_inode_event', '.handle_event = ksu_handle_event_419', code)
              with open(pkg_obs, 'w') as f: f.write(code)

          with open('fs/namei.c', 'r') as f: namei = f.read()
          namei_new, n = re.subn(r'\bstatic\s+(int\s+filename_lookup\s*\()', r'\1', namei)
          if n:
              with open('fs/namei.c', 'w') as f: f.write(namei_new)

          decl = '\nextern int filename_lookup(int dfd, struct filename *name, unsigned flags, struct path *path, struct path *root);\n'
          for target in ['fs/open.c', 'fs/stat.c']:
              with open(target, 'r') as f: code = f.read()
              if 'extern int filename_lookup(' not in code:
                  includes = list(re.finditer(r'^#include\s+[<"].*?[>"]', code, flags=re.MULTILINE))
                  last_inc_end = includes[-1].end()
                  code = code[:last_inc_end] + decl + code[last_inc_end:]
                  with open(target, 'w') as f: f.write(code)
          EOF

            cat << 'EOF' >> arch/arm64/configs/blossom_defconfig
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          # CONFIG_KSU_SUSFS_SUS_MOUNT is not set
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          # CONFIG_KPROBES is not set
          EOF
          fi

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="ZexxaDev"
          export KBUILD_BUILD_HOST="GitHubActions"
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G

          sed -i '/CONFIG_DEFAULT_BIC/d;/CONFIG_DEFAULT_CUBIC/d;/CONFIG_DEFAULT_RENO/d;/CONFIG_DEFAULT_TCP_CONG/d' arch/arm64/configs/blossom_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 blossom_defconfig

          ./scripts/config --file out/.config \
            -e TCP_CONG_ADVANCED \
            -e TCP_CONG_BBR \
            -e DEFAULT_BBR \
            -d DEFAULT_BIC \
            -d DEFAULT_CUBIC \
            -d DEFAULT_RENO \
            --set-str DEFAULT_TCP_CONG "bbr" \
            -e NET_SCH_FQ \
            -e NET_SCH_DEFAULT \
            -e DEFAULT_FQ \
            --set-str DEFAULT_NET_SCH "fq" \
            -e WQ_POWER_EFFICIENT_DEFAULT \
            -e LRU_GEN \
            -e LRU_GEN_ENABLED \
            -e ZRAM_DEDUP \
            -e SWAP_VMA_READAHEAD \
            -e CRYPTO_LZ4 \
            --set-str LOCALVERSION "-madaraKernel" \
            -d LOCALVERSION_AUTO

          make -j$(nproc --all) O=out ARCH=arm64 olddefconfig

          if [ "${{ matrix.variant }}" == "RSKSU-SusFS" ]; then
            grep -q "^CONFIG_KSU=y" out/.config || exit 1
            grep -q "^CONFIG_KSU_SUSFS=y" out/.config || exit 1
          fi

          set -o pipefail
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LOCALVERSION="" \
            CC="ccache clang" \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz-dtb 2>&1 | tee build.log || {
              grep -iE "error:|undefined symbol|undefined reference" build.log | tail -n 25
              exit 1
            }

          ccache -s

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/zexxadev/AnyKernel3-blossom.git anykernel
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/

          cd anykernel

          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=madaraKernel 4.19.325 (${{ matrix.variant }}) by @zexxadev
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=blossom
          device.name2=dandelion
          device.name3=angelica
          device.name4=angelican
          device.name5=cattail
          device.name6=angelicain
          supported.versions=
          supported.patchlevels=
          '; }

          ### AnyKernel install
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          ## end install
          EOF

          rm -rf .git README.md
          ZIP_NAME="madaraKernel-blossom-${{ matrix.variant }}-$(date +%Y%m%d).zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" .
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          unzip -l "$GITHUB_WORKSPACE/$ZIP_NAME" | grep -q "META-INF/com/google/android/update-binary" || exit 1
          echo "OK: $ZIP_NAME valid dan siap flash."

      - name: Publish to niigo_kernel_xiaomi_blossom
        uses: softprops/action-gh-release@v2
        with:
          repository: zexxadev/niigo_kernel_xiaomi_blossom
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: madara-b${{ github.run_number }}
          name: madaraKernel Blossom (Build #${{ github.run_number }})
          body: |
            ### Changelogs
            ${{ env.CHANGELOG }}
          files: ${{ env.ZIP_NAME }}
          prerelease: true
          make_latest: true

      - name: Send Flashable ZIP & MD5 to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
          VARIANT: ${{ matrix.variant }}
          CHANGELOG: ${{ env.CHANGELOG }}
        run: |
          python3 - << 'EOF'
          import glob, hashlib, html, os, sys, urllib.request, uuid

          workspace = os.environ.get("GITHUB_WORKSPACE", ".")
          zip_name = os.environ["ZIP_NAME"]
          matches = glob.glob(os.path.join(workspace, "**", zip_name), recursive=True)
          if not matches:
              sys.exit(f"ERROR: File {zip_name} tidak ditemukan")

          file_path = matches[0]
          with open(file_path, "rb") as f:
              file_data = f.read()

          md5_hash = hashlib.md5(file_data).hexdigest()
          clog = html.escape(os.environ.get("CHANGELOG", "• Maintenance build"))
          caption = (
              f"<b>madaraKernel ({os.environ['VARIANT']})</b>\n"
              f"MD5: <code>{md5_hash}</code>\n\n"
              f"<b>Changelog:</b>\n{clog}"
          )

          boundary = f"----WebKitFormBoundary{uuid.uuid4().hex}"
          body = bytearray()
          for key, val in {"chat_id": os.environ["TG_CHAT_ID"], "caption": caption, "parse_mode": "HTML"}.items():
              body.extend(f"--{boundary}\r\n".encode())
              body.extend(f'Content-Disposition: form-data; name="{key}"\r\n\r\n{val}\r\n'.encode())

          body.extend(f"--{boundary}\r\n".encode())
          body.extend(
              f'Content-Disposition: form-data; name="document"; filename="{os.path.basename(file_path)}"\r\n'
              f"Content-Type: application/zip\r\n\r\n".encode()
          )
          body.extend(file_data)
          body.extend(f"\r\n--{boundary}--\r\n".encode())

          url = f"https://api.telegram.org/bot{os.environ['TG_BOT_TOKEN']}/sendDocument"
          req = urllib.request.Request(url, data=bytes(body))
          req.add_header("Content-Type", f"multipart/form-data; boundary={boundary}")
          with urllib.request.urlopen(req, timeout=120) as resp:
              print("Telegram upload sukses:", resp.status)
          EOF
