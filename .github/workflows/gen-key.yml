name: Generate ZexSU Signing Secrets

on:
  workflow_dispatch:

jobs:
  generate-secrets:
    runs-on: ubuntu-22.04
    steps:
      - name: Generate Keystore & Save Directly to Repo Secrets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          keytool -genkeypair -v -keystore zexsu.jks \
            -alias zexsu -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zexsu1234 -keypass zexsu1234 \
            -dname "CN=ZexSU, OU=ZexxaDev, O=ZexxaDev, L=ID, S=ID, C=ID"

          base64 -w 0 zexsu.jks | gh secret set ZEXSU_KEYSTORE_B64 -R ${{ github.repository }}
          gh secret set ZEXSU_KEY_ALIAS -b "zexsu" -R ${{ github.repository }}
          gh secret set ZEXSU_KEY_PASS -b "zexsu1234" -R ${{ github.repository }}

          python3 - << 'PY'
          import hashlib, os, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          der = subprocess.check_output([
              "keytool", "-exportcert", "-keystore", "zexsu.jks",
              "-alias", "zexsu", "-storepass", "zexsu1234"
          ])
          size_hex = hex(len(der))
          sha_hex = hashlib.sha256(der).hexdigest()

          subprocess.run(["gh", "secret", "set", "ZEXSU_SIZE", "-b", size_hex, "-R", repo], check=True)
          subprocess.run(["gh", "secret", "set", "ZEXSU_HASH", "-b", sha_hex, "-R", repo], check=True)
          print(f"OK! Tersimpan ke Secrets -> SIZE: {size_hex} | HASH: {sha_hex}")
          PY
