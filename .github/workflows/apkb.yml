name: Build ZexSU Manager APK (Send to Telegram)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, atau commit SHA Baka-SU/BakaSU"
        required: true
        default: "main"
      build_type:
        description: "Tipe build (release atau debug)"
        required: true
        default: "release"

permissions:
  contents: read

jobs:
  build-manager:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout madara-builder (for UI assets)
        uses: actions/checkout@v4
        with:
          path: _builder_repo

      - name: Backup custom UI assets
        run: |
          rm -rf /tmp/bakasu-ui
          if [ -d "_builder_repo/Manager/BakaSU/assets/UI" ]; then
            mkdir -p /tmp/bakasu-ui
            cp -r "_builder_repo/Manager/BakaSU/assets/UI/." /tmp/bakasu-ui/
            ls -la /tmp/bakasu-ui
          else
            echo "Folder _builder_repo/Manager/BakaSU/assets/UI tidak ditemukan."
          fi

      - name: Checkout BakaSU repository
        uses: actions/checkout@v4
        with:
          repository: Baka-SU/BakaSU
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0
          fetch-depth: 0
          clean: true

      - name: Apply Material Glass UI & Archive Name
        run: |
          TARGET_DIR="manager/app/src/main/java/org/bakasu/bakasu/ui/theme"
          mkdir -p "$TARGET_DIR"
          if [ -d "/tmp/bakasu-ui" ] && [ -n "$(ls -A /tmp/bakasu-ui 2>/dev/null)" ]; then
            cp -r /tmp/bakasu-ui/. "$TARGET_DIR"/
            ls -la "$TARGET_DIR"
          fi

          if [ -f "$TARGET_DIR/Theme.kt" ]; then
            sed -i 's/_isEnableBlur = mutableStateOf(false)/_isEnableBlur = mutableStateOf(true)/g' "$TARGET_DIR/Theme.kt"
          fi

          if [ -f "manager/app/build.gradle.kts" ]; then
            sed -i 's/"BakaSU_\${managerVersionName}_\$managerVersionCode"/"ZexSU_\${managerVersionName}_\$managerVersionCode"/g' manager/app/build.gradle.kts
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Detect NDK Version from libs.versions.toml
        run: |
          NDK_VER=$(grep -E '^ndk[[:space:]]*=' manager/gradle/libs.versions.toml | head -n 1 | cut -d'"' -f2)
          if [ -z "$NDK_VER" ]; then
            NDK_VER="27.2.12479018"
          fi
          echo "Detected NDK_VERSION=$NDK_VER"
          echo "NDK_VERSION=$NDK_VER" >> "$GITHUB_ENV"

      - name: Cache Gradle & Android NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-jdk21-gradle-${{ hashFiles('manager/gradle/wrapper/gradle-wrapper.properties', 'manager/**/build.gradle*', 'manager/**/libs.versions.toml') }}
          restore-keys: |
            android-ndk-${{ env.NDK_VERSION }}-jdk21-gradle-
            android-ndk-${{ env.NDK_VERSION }}-

      - name: Install Android NDK
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name "sdkmanager" -type f | sort -V | tail -n 1)
            fi
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "ndk;$NDK_VERSION"
          else
            echo "NDK $NDK_VERSION sudah tersedia dari cache."
          fi
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Setup Rust nightly toolchain for Android arm64
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            **/target/aarch64-linux-android
          key: cargo-nightly-arm64-${{ runner.os }}-${{ inputs.ref }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-nightly-arm64-${{ runner.os }}-

      - name: Setup cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libksud.so for arm64-v8a
        run: |
          export KSU_PACKAGE_NAME="org.zexsu.manager"

          if [ -f "userspace/ksud/Cargo.toml" ]; then
            KSUD_DIR="userspace/ksud"
          elif [ -f "ksud/Cargo.toml" ]; then
            KSUD_DIR="ksud"
          else
            KSUD_DIR=$(find . -maxdepth 3 -name "Cargo.toml" -exec grep -l "ksud" {} + | head -n 1 | xargs dirname)
          fi

          echo "Building ksud in: $KSUD_DIR (KSU_PACKAGE_NAME=$KSU_PACKAGE_NAME)"
          (cd "$KSUD_DIR" && cargo ndk b -P 26 -t aarch64-linux-android -r -Z build-std-features="optimize_for_size" -Z trim-paths)

          JNI_DIR="manager/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_DIR"
          cp "$KSUD_DIR/target/aarch64-linux-android/release/ksud" "$JNI_DIR/libksud.so"
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$JNI_DIR/libksud.so"
          ls -lh "$JNI_DIR/libksud.so"

      - name: Build & Zipalign APK (arm64-v8a)
        id: build_apk
        run: |
          chmod +x manager/gradlew
          GRADLE_PROPS="-PKSU_PACKAGE_NAME=org.zexsu.manager -PKSU_NAME=ZexSU"
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./manager/gradlew -p manager assembleDebug $GRADLE_PROPS --build-cache
            SRC_APK=$(find manager/app/build/outputs/apk/debug -name "*arm64-v8a*.apk" | head -n 1)
            [ -z "$SRC_APK" ] && SRC_APK=$(find manager/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          else
            ./manager/gradlew -p manager assembleRelease $GRADLE_PROPS --build-cache
            SRC_APK=$(find manager/app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
            [ -z "$SRC_APK" ] && SRC_APK=$(find manager/app/build/outputs/apk/release -name "*universal*.apk" | head -n 1)
            [ -z "$SRC_APK" ] && SRC_APK=$(find manager/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi

          echo "Selected SRC_APK: $SRC_APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          ALIGNED_APK="manager/app/build/outputs/apk/ZexSU-${{ inputs.build_type }}-arm64.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$SRC_APK" "$ALIGNED_APK"
          ls -lh "$ALIGNED_APK"
          echo "apk_path=$ALIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Auto-Sign & Verify ZexSU APK
        id: sign_apk
        env:
          ZEXSU_KEYSTORE_B64: ${{ secrets.ZEXSU_KEYSTORE_B64 }}
          ZEXSU_KEY_ALIAS: ${{ secrets.ZEXSU_KEY_ALIAS }}
          ZEXSU_KEY_PASS: ${{ secrets.ZEXSU_KEY_PASS }}
          ZEXSU_KS_PASS: ${{ secrets.ZEXSU_KS_PASS }}
          ZEXSU_HASH: ${{ secrets.ZEXSU_HASH }}
          APK_PATH: ${{ steps.build_apk.outputs.apk_path }}
        run: |
          if [ -n "$ZEXSU_KEYSTORE_B64" ] && [ -n "$ZEXSU_KEY_ALIAS" ] && [ -n "$ZEXSU_KEY_PASS" ]; then
            echo "$ZEXSU_KEYSTORE_B64" | base64 -d > /tmp/zexsu.jks
            STORE_PASS="$ZEXSU_KEY_PASS"
            if ! keytool -list -keystore /tmp/zexsu.jks -storepass "$STORE_PASS" >/dev/null 2>&1; then
              STORE_PASS="$ZEXSU_KS_PASS"
            fi

            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            SIGNED_APK="${APK_PATH%.apk}-signed.apk"
            "$APKSIGNER" sign               --ks /tmp/zexsu.jks               --ks-key-alias "$ZEXSU_KEY_ALIAS"               --ks-pass "pass:$STORE_PASS"               --key-pass "pass:$ZEXSU_KEY_PASS"               --out "$SIGNED_APK"               "$APK_PATH"
            rm -f /tmp/zexsu.jks

            CERT_SHA256=$("$APKSIGNER" verify --print-certs "$SIGNED_APK" | grep -m1 "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}')
            echo "Signed Certificate SHA-256: $CERT_SHA256"
            if [ -n "$ZEXSU_HASH" ] && [ "${CERT_SHA256,,}" = "${ZEXSU_HASH,,}" ]; then
              echo "Signature Hash: MATCH dengan ZEXSU_HASH kernel!"
            else
              echo "Peringatan: Hash sertifikat berbeda dari ZEXSU_HASH."
            fi

            echo "final_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"
            echo "sign_status=Signed (Keystore ZexSU Verified)" >> "$GITHUB_OUTPUT"
          else
            echo "Secret keystore tidak lengkap, memakai APK unsigned."
            echo "final_apk=$APK_PATH" >> "$GITHUB_OUTPUT"
            echo "sign_status=Unsigned (Siap sign via MT Manager)" >> "$GITHUB_OUTPUT"
          fi

      - name: Send APK to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FINAL_APK: ${{ steps.sign_apk.outputs.final_apk }}
          SIGN_STATUS: ${{ steps.sign_apk.outputs.sign_status }}
          REF_NAME: ${{ inputs.ref }}
          BUILD_TYPE: ${{ inputs.build_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          CAPTION=$(printf '🛡️ <b>ZexSU Manager</b> (<code>org.zexsu.manager</code>)\n• <b>UI:</b> Material Glass\n• <b>Ref:</b> <code>%s</code> (%s)\n• <b>Status:</b> %s\n• <b>Run:</b> #%s' "$REF_NAME" "$BUILD_TYPE" "$SIGN_STATUS" "$RUN_NUMBER")
          RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            --form-string "chat_id=${TG_CHAT_ID}" \
            -F "document=@${FINAL_APK}" \
            --form-string "caption=${CAPTION}" \
            --form-string "parse_mode=HTML")

          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true'

      - name: Upload APK artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: ZexSU-Manager-${{ inputs.build_type }}
          path: ${{ steps.sign_apk.outputs.final_apk }}
          if-no-files-found: error
