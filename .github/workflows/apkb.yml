name: Build BakaSU Manager APK (Send to Telegram)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, atau commit SHA Baka-SU/BakaSU"
        required: true
        default: "main"
      build_type:
        description: "Tipe build (release atau debug)"
        required: true
        default: "release"

permissions:
  contents: read

jobs:
  build-manager:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.3.11579264"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout BakaSU repository
        uses: actions/checkout@v4
        with:
          repository: Baka-SU/BakaSU
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: "gradle"

      - name: Cache Gradle & Android NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-gradle-${{ hashFiles('manager/gradle/wrapper/gradle-wrapper.properties', 'manager/**/build.gradle*', 'manager/**/libs.versions.toml') }}
          restore-keys: |
            android-ndk-${{ env.NDK_VERSION }}-gradle-
            android-ndk-${{ env.NDK_VERSION }}-

      - name: Install Android NDK (Fix sdkmanager legacy 'tools' error)
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name "sdkmanager" -type f | sort -V | tail -n 1)
            fi
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "ndk;$NDK_VERSION"
          else
            echo "NDK $NDK_VERSION sudah tersedia dari cache."
          fi
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain for Android arm64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            **/target/aarch64-linux-android
          key: cargo-arm64-${{ runner.os }}-${{ inputs.ref }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-arm64-${{ runner.os }}-

      - name: Build libksud.so for arm64-v8a
        env:
          CARGO_NDK_ANDROID_PLATFORM: "26"
        run: |
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"

          if [ -f "userspace/ksud/Cargo.toml" ]; then
            KSUD_DIR="userspace/ksud"
          elif [ -f "ksud/Cargo.toml" ]; then
            KSUD_DIR="ksud"
          else
            KSUD_DIR=$(find . -maxdepth 3 -name "Cargo.toml" -exec grep -l "ksud" {} + | head -n 1 | xargs dirname)
          fi

          echo "Building ksud in: $KSUD_DIR"
          cargo build --manifest-path "$KSUD_DIR/Cargo.toml" --target aarch64-linux-android --release

          JNI_DIR="manager/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_DIR"
          cp "$KSUD_DIR/target/aarch64-linux-android/release/ksud" "$JNI_DIR/libksud.so"
          "$NDK_BIN/llvm-strip" --strip-unneeded "$JNI_DIR/libksud.so"
          ls -lh "$JNI_DIR/libksud.so"

      - name: Build & Zipalign APK (Ready for MT Manager)
        id: build_apk
        run: |
          chmod +x manager/gradlew
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./manager/gradlew -p manager assembleDebug --build-cache
            SRC_APK=$(find manager/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          else
            ./manager/gradlew -p manager assembleRelease --build-cache
            SRC_APK=$(find manager/app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
            if [ -z "$SRC_APK" ]; then
              SRC_APK=$(find manager/app/build/outputs/apk/release -name "*.apk" | head -n 1)
            fi
          fi

          OUT_APK="manager/app/build/outputs/apk/BakaSU-${{ inputs.build_type }}-for-MT-Manager.apk"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -p -f 4 "$SRC_APK" "$OUT_APK"
          ls -lh "$OUT_APK"
          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"

      - name: Send APK to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          APK_PATH: ${{ steps.build_apk.outputs.apk_path }}
          REF_NAME: ${{ inputs.ref }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          CAPTION="BakaSU Manager APK siap sign MT Manager%0ARef: ${REF_NAME}%0AType: ${BUILD_TYPE}%0ARun: ${{ github.run_number }}"
          RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TG_CHAT_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=${CAPTION}")

          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true'

      - name: Upload APK artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-Manager-${{ inputs.build_type }}
          path: ${{ steps.build_apk.outputs.apk_path }}
          if-no-files-found: error